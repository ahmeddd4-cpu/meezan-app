name: Build Android APK (Rust + Dioxus)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.6.3

      - name: Bundle Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: dx bundle --platform android --release

      - name: Upload Meezan APK
        uses: actions/upload-artifact@v4
        with:
          name: Meezan-Android-APK
          path: target/dx/meezan/release/android/**/*.apk
